name: Scheduled Hevy Sync

on:
  schedule:
    # Run every night at 17:00 UTC (00:00 Bangkok Time UTC+7)
    - cron: '0 17 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Hevy Sync
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          SUPABASE_POSTGRES_CONNECTION_STRING: ${{ secrets.SUPABASE_POSTGRES_CONNECTION_STRING }}
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/cronSync.js

