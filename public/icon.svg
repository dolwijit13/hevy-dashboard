<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for full bleed adaptive icon -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e2f23" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#040405" />
    </radialGradient>

    <!-- Emerald Core Ambient Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Emerald Primary Gradient for Plates -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Outer Plate Contrast Gradient -->
    <linearGradient id="plateDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Handle & Bar Grip Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Soft Depth Shadow & Glow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#10b981" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Full-bleed background (solid edge-to-edge for Android Maskable / Adaptive icon) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Ambient emerald aura centered at (256, 256) -->
  <circle cx="256" cy="256" r="180" fill="url(#coreGlow)" />

  <!-- Centered Diagonal Dumbbell Emblem (Strictly inside Android 80% Safe Zone circle) -->
  <g transform="rotate(-45 256 256)" filter="url(#shadow)">
    <!-- Central Bar / Handle -->
    <rect x="206" y="244" width="100" height="24" rx="12" fill="url(#handleGrad)" />

    <!-- Handle Knurling / Grip Rings -->
    <rect x="228" y="246" width="3" height="20" rx="1.5" fill="#ffffff" fill-opacity="0.5" />
    <rect x="238" y="246" width="3" height="20" rx="1.5" fill="#ffffff" fill-opacity="0.5" />
    <rect x="248" y="246" width="3" height="20" rx="1.5" fill="#ffffff" fill-opacity="0.5" />
    <rect x="258" y="246" width="3" height="20" rx="1.5" fill="#ffffff" fill-opacity="0.5" />
    <rect x="268" y="246" width="3" height="20" rx="1.5" fill="#ffffff" fill-opacity="0.5" />
    <rect x="278" y="246" width="3" height="20" rx="1.5" fill="#ffffff" fill-opacity="0.5" />

    <!-- Left Collars & Plates -->
    <rect x="194" y="234" width="12" height="44" rx="5" fill="url(#plateGrad)" />
    <!-- Plate 1 (Inner, Largest) -->
    <rect x="162" y="176" width="28" height="160" rx="9" fill="url(#plateGrad)" />
    <rect x="165" y="179" width="4" height="154" rx="2" fill="#ffffff" fill-opacity="0.25" />
    <!-- Plate 2 (Middle) -->
    <rect x="130" y="196" width="26" height="120" rx="8" fill="url(#plateDarkGrad)" />
    <rect x="133" y="199" width="3" height="114" rx="1.5" fill="#ffffff" fill-opacity="0.2" />
    <!-- Plate 3 (Outer, Smallest) -->
    <rect x="102" y="216" width="22" height="80" rx="7" fill="url(#plateGrad)" />
    <rect x="104" y="218" width="3" height="76" rx="1.5" fill="#ffffff" fill-opacity="0.2" />
    <!-- End Cap Left -->
    <rect x="86" y="244" width="14" height="24" rx="6" fill="url(#handleGrad)" />

    <!-- Right Collars & Plates (Symmetric) -->
    <rect x="306" y="234" width="12" height="44" rx="5" fill="url(#plateGrad)" />
    <!-- Plate 1 (Inner, Largest) -->
    <rect x="322" y="176" width="28" height="160" rx="9" fill="url(#plateGrad)" />
    <rect x="325" y="179" width="4" height="154" rx="2" fill="#ffffff" fill-opacity="0.25" />
    <!-- Plate 2 (Middle) -->
    <rect x="356" y="196" width="26" height="120" rx="8" fill="url(#plateDarkGrad)" />
    <rect x="359" y="199" width="3" height="114" rx="1.5" fill="#ffffff" fill-opacity="0.2" />
    <!-- Plate 3 (Outer, Smallest) -->
    <rect x="388" y="216" width="22" height="80" rx="7" fill="url(#plateGrad)" />
    <rect x="390" y="218" width="3" height="76" rx="1.5" fill="#ffffff" fill-opacity="0.2" />
    <!-- End Cap Right -->
    <rect x="412" y="244" width="14" height="24" rx="6" fill="url(#handleGrad)" />
  </g>
</svg>
